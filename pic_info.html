function outOpen(url) {
	if(app_yn=='Y') {
		if ((app_os=='android' && parseInt(app_ver) < 51) || (app_os=='ios' && parseInt(app_ver) < 38)) {
			open(url,'_blank','')
		} else {
			if(app_os=='ios') {
				goIosAp('openBrowser',url)
			} else {
				try {
		    	location.href = "blank://" + url
		    } catch(e) {
		      open(url,'_blank','')
		    }
		  }
		}
	} else {
		open(url,'','')
	}
}
